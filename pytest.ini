[pytest]
# Why this file exists
# -------------------
# CI failed with:
#   ERROR collecting tests/test_preprocessing.py
#   ModuleNotFoundError: No module named 'app'
#
# The tests live in tests/ without an __init__.py, so pytest's default "prepend"
# import mode inserts tests/ onto sys.path, not the repository root. That makes
# `app.*` unimportable when pytest is launched as the bare console script, which
# is exactly what CI did. Running `python -m pytest` locally happened to work
# because the -m form puts the current directory on sys.path, which is why the
# failure only ever reproduced in GitHub Actions.
#
# Declaring pythonpath makes every invocation behave the same way (bare `pytest`,
# `python -m pytest`, and the Makefile target), so local and CI runs agree.
pythonpath = .
testpaths = tests
