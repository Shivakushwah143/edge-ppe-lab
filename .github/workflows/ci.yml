name: edge-ppe-ci
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app scripts tests
      - run: pytest -q
      - name: Validate model contract when artifact is present
        run: |
          if [ -f var/releases/v1/model.onnx ]; then
            EDGE_PPE_MODEL_PATH="$PWD/var/releases/v1/model.onnx" EDGE_PPE_MODEL_VERSION=1 python -c "from app.model_runtime import RuntimeModel; from app.config import Settings; print(RuntimeModel.from_settings(Settings()).identity)"
          else
            echo 'No committed ONNX artifact; reproducible export is validated in the release journey.'
          fi
      - name: Build immutable Docker candidate
        run: docker build -f docker/Dockerfile -t edge-ppe-lab:${GITHUB_SHA} .
